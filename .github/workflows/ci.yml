name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Go tests, vet and gofmt, and the tools' Python tests.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the Python packages
        run: python3 -m pip install --disable-pip-version-check -r conformance/requirements.txt

      - run: make check

  check-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - run: make check-ts

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: ./.github/actions/conformance-tools

      - run: make conformance

  conformance-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - uses: ./.github/actions/conformance-tools

      - run: make conformance-ts

  # The Java library is built with JDK 25 for Java 17, and its tests run on Java 17, so that
  # nothing newer than 17 gets in. setup-java puts the last version listed on the path.
  check-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
          cache: maven
          cache-dependency-path: java/pom.xml

      - run: make check-java MVN="mvn -B -Djvm=$JAVA_HOME_17_X64/bin/java"

  conformance-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25
          cache: maven
          cache-dependency-path: java/pom.xml

      - uses: ./.github/actions/conformance-tools

      # Built with 25, and run with 17.
      - run: mvn -B -q -f java/pom.xml package -DskipTests
      - run: python3 conformance/run.py "$JAVA_HOME_17_X64/bin/java" -Xlog:disable -Xlog:all=warning:stderr -jar java/target/vexyl.jar

  # The Ruby library's tests run on Ruby 3.1, the oldest it supports, so that nothing newer gets in,
  # and the suite runs on the newest Ruby. It needs no gems beyond Ruby's own, so there's no bundle.
  check-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - run: make check-ruby

  conformance-ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - uses: ./.github/actions/conformance-tools

      - run: make conformance-ruby

  # The Rust library is checked with the stable toolchain, then its tests run on its
  # rust-version, 1.88, so that nothing newer gets in.
  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt
          rust-src-dir: rust

      - run: make check-rust

      - name: Test on the rust-version
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 test --manifest-path rust/Cargo.toml

  conformance-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rust-src-dir: rust

      - uses: ./.github/actions/conformance-tools

      - run: make conformance-rust

  # Runs the suite against libraries with one thing wrong, some of them the Go reference patched.
  conformance-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: ./.github/actions/conformance-tools

      - run: make conformance-prove

  # The editor's tests read flags from a vexyl-flags checkout beside this one, so both are checked
  # out side by side.
  check-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vexyl
    steps:
      - uses: actions/checkout@v7
        with:
          path: vexyl

      - uses: actions/checkout@v7
        with:
          repository: NaomiAmethyst/vexyl-flags
          path: vexyl-flags

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vexyl/web/package-lock.json

      # The end-to-end tests drive playwright-core, which brings no browser. They use the newest
      # Chromium in Playwright's cache, so this installs the one its version expects.
      - name: Install Chromium
        run: npx --yes playwright@1.64.1 install --with-deps chromium

      - run: make check-web

  check-rescale:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vexyl
    steps:
      - uses: actions/checkout@v7
        with:
          path: vexyl

      - uses: actions/checkout@v7
        with:
          repository: NaomiAmethyst/vexyl-flags
          path: vexyl-flags

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vexyl/web/package-lock.json

      - uses: ./vexyl/.github/actions/conformance-tools
        with:
          root: vexyl

      - run: make check-rescale
