name: release

# A release is a commit setting ts/package.json's version, tagged v<that version> and pushed.
# docs/releasing.md has the steps. The images for the tag come from docker.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Nothing else runs unless the tag is the version the commit says it is.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(jq -r .version ts/package.json)"
          if [ "$tag" != "$package" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but ts/package.json's version is $package"
            exit 1
          fi
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag isn't a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # The Go module lives in go/, so Go looks for its versions as tags named go/v1.2.3.
  go-module:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag the Go module
        run: |
          tag="go/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already there"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

      # Fetching the version through the module proxy is what puts it on pkg.go.dev. The proxy
      # writes an uppercase letter as ! and the lowercase letter.
      - name: Ask the Go module proxy for it
        run: |
          url="https://proxy.golang.org/github.com/!naomi!amethyst/vexyl/go/@v/v$VERSION.info"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url"; then
              exit 0
            fi
            sleep 20
          done
          echo "::warning::the proxy didn't have v$VERSION yet; pkg.go.dev will find it on the first go install"

  github-release:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build the CLI
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="vexyl_${VERSION}_${os}_${arch}"
            exe=vexyl
            if [ "$os" = windows ]; then
              exe=vexyl.exe
            fi
            mkdir -p "build/$name"
            (cd go && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../build/$name/$exe" ./cmd/vexyl)
            cp LICENSE NOTICE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Vexyl $VERSION" "${flags[@]}"

  # Trusted publishing: npm trusts this workflow by its OIDC token, so there's no token secret.
  # The publish carries provenance, which links it to this run.
  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ts/package-lock.json

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.2

      - run: npm ci --no-audit --no-fund

      - run: npm test

      # Builds dist again without the tests' build, and adds the license files, which live at the root.
      - name: Build the package
        run: |
          rm -rf dist
          npm run build
          cp ../LICENSE ../NOTICE .
          npm pack --dry-run

      # A re-run, or a version published by hand, is left alone.
      - name: Publish
        run: |
          if [ "$(npm view "vexyl@$VERSION" version 2> /dev/null)" = "$VERSION" ]; then
            echo "vexyl@$VERSION is already on npm"
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--tag next)
          fi
          npm publish --provenance --access public "${flags[@]}"
