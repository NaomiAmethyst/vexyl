name: release

# A release is a commit setting ts/package.json's version, tagged v<that version> and pushed.
# docs/releasing.md has the steps. The images for the tag come from docker.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Nothing else runs unless the tag is the version the commit says it is.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(jq -r .version ts/package.json)"
          if [ "$tag" != "$package" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but ts/package.json's version is $package"
            exit 1
          fi
          # The other libraries say their version in their own files, and must say the same.
          java="$(sed -n 's|^  <version>\(.*\)</version>$|\1|p' java/pom.xml | head -n 1)"
          ruby="$(sed -n 's/^ *VERSION = "\(.*\)"$/\1/p' ruby/lib/vexyl/version.rb)"
          rust="$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)"
          for pair in "java/pom.xml=$java" "ruby/lib/vexyl/version.rb=$ruby" "rust/Cargo.toml=$rust"; do
            if [ "${pair#*=}" != "$tag" ]; then
              echo "::error::the tag is $GITHUB_REF_NAME, but ${pair%%=*} says ${pair#*=}"
              exit 1
            fi
          done
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag isn't a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # The Go module lives in go/, so Go looks for its versions as tags named go/v1.2.3.
  go-module:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag the Go module
        run: |
          tag="go/v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already there"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

      # Fetching the version through the module proxy is what puts it on pkg.go.dev. The proxy
      # writes an uppercase letter as ! and the lowercase letter.
      - name: Ask the Go module proxy for it
        run: |
          url="https://proxy.golang.org/github.com/!naomi!amethyst/vexyl/go/@v/v$VERSION.info"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$url"; then
              exit 0
            fi
            sleep 20
          done
          echo "::warning::the proxy didn't have v$VERSION yet; pkg.go.dev will find it on the first go install"

  github-release:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build the CLI
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="vexyl_${VERSION}_${os}_${arch}"
            exe=vexyl
            if [ "$os" = windows ]; then
              exe=vexyl.exe
            fi
            mkdir -p "build/$name"
            (cd go && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "../build/$name/$exe" ./cmd/vexyl)
            cp LICENSE NOTICE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Vexyl $VERSION" "${flags[@]}"

  # The upload waits in the Central Portal to be published by hand.
  maven:
    needs: version
    uses: ./.github/workflows/maven.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  # Trusted publishing: npm trusts this workflow by its OIDC token, so there's no token secret.
  # The publish carries provenance, which links it to this run.
  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ts/package-lock.json

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.2

      - run: npm ci --no-audit --no-fund

      - run: npm test

      # Builds dist again without the tests' build, and adds the license files, which live at the root.
      - name: Build the package
        run: |
          rm -rf dist
          npm run build
          cp ../LICENSE ../NOTICE .
          npm pack --dry-run

      # A re-run, or a version published by hand, is left alone.
      - name: Publish
        run: |
          if [ "$(npm view "@naomiamethyst/vexyl@$VERSION" version 2> /dev/null)" = "$VERSION" ]; then
            echo "@naomiamethyst/vexyl@$VERSION is already on npm"
            exit 0
          fi
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--tag next)
          fi
          npm publish --provenance --access public "${flags[@]}"

  # Trusted publishing: RubyGems trusts this workflow by its OIDC token and hands back a short-lived
  # key, so there's no token secret.
  rubygems:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - run: make -C .. check-ruby

      # The license files live at the root.
      - name: Build the gem
        run: |
          cp ../LICENSE ../NOTICE .
          gem build vexyl.gemspec

      # RubyGems writes 1.2.3-rc.1 as 1.2.3.pre.rc.1. A re-run, or a version published by hand, is
      # left alone.
      - name: Check whether it's there already
        id: there
        run: |
          gem_version="$(ruby -e 'puts Gem::Version.new(ARGV[0])' "$VERSION")"
          echo "file=vexyl-$gem_version.gem" >> "$GITHUB_OUTPUT"
          if curl -fsS https://rubygems.org/api/v1/versions/vexyl.json 2> /dev/null \
              | jq -e --arg v "$gem_version" 'any(.[]; .number == $v)' > /dev/null; then
            echo "vexyl $gem_version is already on RubyGems"
            echo "there=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.there.outputs.there != 'true'
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - if: steps.there.outputs.there != 'true'
        run: gem push "${{ steps.there.outputs.file }}"

  # Trusted publishing: crates.io trusts this workflow by its OIDC token and hands back a
  # short-lived token. crates.io only takes a trusted publisher for a crate that's already there,
  # so the first version was published by hand.
  crates:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          rust-src-dir: rust

      - run: cargo test

      # A re-run, or a version published by hand, is left alone. crates.io wants a User-Agent.
      - name: Check whether it's there already
        id: there
        run: |
          if curl -fsS -o /dev/null -A "vexyl-release (https://github.com/NaomiAmethyst/vexyl)" \
              "https://crates.io/api/v1/crates/vexyl/$VERSION" 2> /dev/null; then
            echo "vexyl $VERSION is already on crates.io"
            echo "there=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.there.outputs.there != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - if: steps.there.outputs.there != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
