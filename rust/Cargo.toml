[package]
name = "vexyl"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
description = "Reads, checks and renders Vexyl flag documents, a KDL format for flag designs."
license = "Apache-2.0"
authors = ["Naomi Persephone Amethyst <naomi@amethyst.name>"]
repository = "https://github.com/NaomiAmethyst/vexyl"
readme = "README.md"
keywords = ["flag", "kdl", "svg", "vexillology"]
categories = ["graphics", "parser-implementations"]
# LICENSE and NOTICE are links to the root's; Cargo packs what they point to.
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "vexyl"
path = "src/lib.rs"

[[bin]]
name = "vexyl"
path = "src/main.rs"

[dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
