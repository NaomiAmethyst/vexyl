<text x="40" y="597.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">A star’s or sun’s size is the circle through its points, shown dashed.</text>
<text x="40" y="617.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The outline is the polygon through the 5 corners the file lists, each at places marked along the edges.</text>
<text x="40" y="637.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The white star is turned 11.25°.</text>
<text x="40" y="657.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The white star’s size: r 7.7231 · inner 5.5611.</text>
<text x="40" y="677.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The white star’s size: r 12.8401 · inner 8.1434.</text>
<text x="40" y="697.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#3b3947">Not measured on this sheet: the cut in the white disc, the clip on the white star.</text>
