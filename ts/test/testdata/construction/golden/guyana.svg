<text x="40" y="622.626299" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The gold pile stands on the hoist from 1.044 to 28.956, and reaches 46.5199 in from it, to a point.</text>
<text x="40" y="642.626299" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The red pile stands on the hoist from 1.1662 to 28.8338, and reaches 23.0563 in from it, to a point.</text>
<text x="40" y="662.626299" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The sea variant has a sheet of its own.</text>
<text x="40" y="682.626299" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#3b3947">Not measured on this sheet: the gold pile’s fimbriation, the red pile’s fimbriation.</text>
