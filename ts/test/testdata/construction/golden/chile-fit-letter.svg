<text x="766" y="171" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">Law No. 2597 of 11 January 1912, fixing</text>
<text x="766" y="190" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">the colors of the flag of the Republic</text>
<text x="766" y="209" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">of Chile and of the Presidential Sash,</text>
<text x="766" y="228" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">Article 1</text>
<text x="766" y="255" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">Supreme Decree No. 1534 of 18</text>
<text x="766" y="274" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">October 1967, determining the national</text>
<text x="766" y="293" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">emblems and regulating their use,</text>
<text x="766" y="312" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#1c1b22">Articles 1 and 3</text>
