<text x="40" y="657.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">A star’s or sun’s size is the circle through its points, shown dashed.</text>
<text x="40" y="677.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The design “badge” is drawn on a grid of its own, 5 by 6, at 2 times its size, so that it fills 10 by 12. Its sizes here are the flag’s.</text>
<text x="40" y="697.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The stretched variant and the boxes variant have sheets of their own.</text>
