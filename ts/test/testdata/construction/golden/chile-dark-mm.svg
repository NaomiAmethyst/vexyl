<text x="832.519685" y="404" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">Law No. 2597 of 11 January 1912, fixing</text>
<text x="832.519685" y="423" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">the colors of the flag of the Republic</text>
<text x="832.519685" y="442" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">of Chile and of the Presidential Sash,</text>
<text x="832.519685" y="461" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">Article 1</text>
<text x="832.519685" y="488" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">Supreme Decree No. 1534 of 18</text>
<text x="832.519685" y="507" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">October 1967, determining the national</text>
<text x="832.519685" y="526" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">emblems and regulating their use,</text>
<text x="832.519685" y="545" font-family="Geist, system-ui, sans-serif" font-size="13" fill="#f0eef5">Articles 1 and 3</text>
