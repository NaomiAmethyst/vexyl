<text x="40" y="670.690289" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The swallowtail is cut 8 in from the fly, to a point on the middle line, and its tails end 2.5 in from the fly’s corners, along it.</text>
<text x="40" y="690.690289" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The pennant variant, the point variant, the curved variant and the saw variant have sheets of their own.</text>
