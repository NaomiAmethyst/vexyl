<text x="40" y="625.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The wavy edge between the first two bars, and each of the others, is centered on where a straight edge would be, and repeats</text>
<text x="40" y="641.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">along its 30. It starts at the hoist, at its middle, heading away from the bar listed before it.</text>
<text x="40" y="661.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The wavy edge of the panel is centered on where a straight edge would be, and has 4 periods along its 20. It starts at the top, at</text>
<text x="40" y="677.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">its middle, heading away from the panel.</text>
<text x="40" y="697.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The bend variant has a sheet of its own.</text>
