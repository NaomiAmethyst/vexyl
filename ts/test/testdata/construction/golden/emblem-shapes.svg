<text x="40" y="577.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">A star’s or sun’s size is the circle through its points, shown dashed.</text>
<text x="40" y="597.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">6 white discs in a ring of radius 5 around the center marked +, starting at the top of the frame of the emblem along the bend.</text>
<text x="40" y="617.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The white disc is at the origin of the emblem along the bend.</text>
<text x="40" y="637.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">Sizes along a slanting axis are measured along it, and across it square to it.</text>
<text x="40" y="657.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The turned variant has a sheet of its own.</text>
<text x="40" y="677.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The red rect is turned 30° within the emblem along the bend.</text>
<text x="40" y="697.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The gold sun is 10 along the axis of the emblem along the bend from its origin, and -8 across it, as the file gives them.</text>
