<text x="40" y="641.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The 2 bars along the bend share the width across them, square to their axis, as 1 : 1, from the one listed first.</text>
<text x="40" y="661.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The zigzag edge between the bars is centered on where a straight edge would be, and has 7 periods along the diagonal. It starts at</text>
<text x="40" y="677.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">the upper hoist corner, with a point toward the bar listed before it.</text>
<text x="40" y="697.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">Its period is the diagonal’s length divided by 7.</text>
