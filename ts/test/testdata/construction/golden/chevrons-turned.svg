<text x="40" y="657.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The chevrons are turned 20° clockwise about the center, from the hoist.</text>
<text x="40" y="677.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">Sizes along a slanting axis are measured along it, and across it square to it.</text>
<text x="40" y="697.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The off variant has a sheet of its own.</text>
