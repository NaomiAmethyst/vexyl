<text x="40" y="661.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The short variant is the flag at a proportion of 1.2, by its rule for a narrower flag, hoist-scale. Every size here is worked out from the</text>
<text x="40" y="677.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">file’s by that rule, exactly.</text>
<text x="40" y="697.700787" font-family="Geist, system-ui, sans-serif" font-size="12" fill="#55525f">The long variant and the hanging variant have sheets of their own.</text>
