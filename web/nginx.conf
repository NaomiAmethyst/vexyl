# The editor's server in the vexyl-web image. Its file names don't change between builds, so
# pages, scripts and styles are checked with the server every time; only fonts are kept longer.

map $uri $vexyl_cache {
    default            "no-cache";
    ~^/fonts/.*\.woff2$ "public, max-age=604800";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    charset utf-8;
    charset_types text/html text/css text/plain text/javascript application/javascript image/svg+xml;
    gzip on;
    gzip_types text/css text/plain text/javascript application/javascript image/svg+xml;

    add_header Cache-Control $vexyl_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # The page's own policy is in its meta tag, which can't stop it being framed.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
